<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>[hidden]{display:none!important}</style>
<title>Capsa Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: one Capsa window (1280×800) centred on the ground and scaled to fit; three views inside it: Catalogue, Search, Inspector. Single dark look, as in the brand. */
:root{
  color-scheme:dark;
  --ground:#0B0B0C; --surface:#111113; --tile:#141416; --edge:#2A2A2E;
  --line:rgba(237,237,237,.08); --line2:rgba(237,237,237,.16);
  --ink:#EDEDED; --mid:#8C8D94; --low:#55565D;
  --lid:#4F8CFF; --fault:#E8664A; --close:#C42B1C;
  --f-sans:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--ground)}
body{background:var(--ground);color:var(--ink);font-family:var(--f-sans);font-weight:300;font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;display:flex;flex-direction:column;gap:14px;overflow-x:hidden}
.top{max-width:1280px;width:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;color:var(--mid);font-size:13px}
.top b{font-weight:400;color:var(--ink)}
.stage{position:relative;width:100%;max-width:1280px;margin:0 auto;overflow:hidden;border:1px solid var(--edge);flex:0 0 auto}
.win{position:absolute;top:0;left:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;background:var(--ground);color:var(--ink);font-family:var(--f-sans);font-size:13px;font-weight:400;line-height:1.4;user-select:none}
.win [hidden]{display:none!important}
.win button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.win input{font:inherit;color:inherit}
.win :focus-visible{outline:2px solid var(--lid);outline-offset:1px}
.search input:focus-visible{outline:0}
.details>*,.insp .side>*{flex-shrink:0}
.m{font-family:var(--f-mono);font-size:11px}
.cap{font-size:12px;color:var(--mid)}
.dim{color:var(--mid)} .low{color:var(--low)}
canvas{display:block;width:100%;height:100%}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:square;flex:0 0 auto}
.lock{display:block;height:13px;width:auto}
/* selection lid: a blue bar lifted one gap above the thing it covers, as on the mark */
.lidded{position:relative}
.lidded::before{content:"";position:absolute;left:0;right:0;top:-8px;height:4px;background:var(--lid);opacity:0;transition:opacity .12s;z-index:1}
.lidded.on::before{opacity:1}
.btn{display:inline-flex!important;align-items:center;justify-content:center;height:34px;padding:0 10px!important;border:1px solid var(--line2)!important;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--mid)!important}
.btn.pri{background:var(--ink)!important;color:var(--ground)!important;border-color:var(--ink)!important}
.ib{width:40px;height:40px;display:grid!important;place-items:center;color:var(--mid)}
.ib:hover,.ib.on{color:var(--ink)!important;background:var(--tile)!important}

/* title bar (Windows-style controls) */
.tb{height:40px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--surface);position:relative;z-index:5}
.tb .logo{padding:0 18px;display:flex;align-items:center;height:100%}
.tb .mid{position:absolute;left:50%;top:7px;transform:translateX(-50%)}
.tb .sbox{width:460px;height:26px;display:flex!important;align-items:center;gap:10px;padding:0 10px!important;background:var(--ground)!important;border:1px solid var(--line2)!important;color:var(--mid)!important;font-size:12.5px}
.tb .sbox:hover{border-color:var(--mid)!important}
.tb .sbox kbd{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--low);border:1px solid var(--line2);padding:0 5px}
.tb .crumb{color:var(--mid);padding-left:12px;border-left:1px solid var(--line);height:18px;display:flex;align-items:center;gap:6px;white-space:pre}
.tb .crumb button:hover{color:var(--ink)} .tb .crumb b{font-weight:400;color:var(--ink)}
.tb .right{margin-left:auto;display:flex;align-items:center;height:100%}
.tb .scan{display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--mid)}
.tb .scan i{display:block;width:80px;height:2px;background:var(--line2);position:relative}
.tb .scan i b{position:absolute;left:0;top:0;bottom:0;background:var(--lid)}
.tb .pos{display:flex;align-items:center;gap:4px;padding:0 10px;color:var(--mid);border-right:1px solid var(--line);height:100%}
.tb .pos button{width:24px;height:24px;display:grid;place-items:center}
.tb .pos button:hover{color:var(--ink)}
.wc{display:flex;height:100%}
.wc span{width:46px;height:100%;display:grid;place-items:center;color:var(--mid)}
.wc span:hover{background:var(--tile);color:var(--ink)}
.wc span.x:hover{background:var(--close);color:var(--ink)}

/* Catalogue */
.cat{position:absolute;top:40px;left:0;right:0;bottom:0;display:grid;grid-template-columns:212px 1fr 304px}
nav{padding:22px 0 22px 28px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);overflow:auto}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
nav li button{width:100%;display:flex!important;justify-content:space-between;align-items:center;padding:5px 20px 5px 0!important;color:var(--mid)}
nav li button:hover{color:var(--ink)}
nav li.on button{color:var(--ink)}
nav li.on b{border-left:2px solid var(--lid);margin-left:-12px;padding-left:10px}
nav li b{font-weight:400}
nav li .auto{font-size:10.5px;color:var(--low);margin-left:6px}
nav li.bad button,nav li.bad .m{color:var(--fault)}
nav .grpd{display:flex;flex-direction:column;gap:6px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
main .head{display:flex;align-items:center;gap:12px;height:72px;padding:0 28px;flex:0 0 auto;position:relative}
main .head .t{font-size:20px;font-weight:300}
main .tools{margin-left:auto;display:flex;align-items:center;gap:10px}
main .tools .ib{width:30px;height:28px;border:1px solid var(--line2)}
main .tools input{width:90px;accent-color:var(--ink)}
.fbtn{display:inline-flex!important;align-items:center;gap:8px;height:28px;padding:0 10px!important;border:1px solid var(--line2)!important;color:var(--mid);margin-left:8px}
.fbtn:hover,.fbtn.on{color:var(--ink)}
.chip{display:inline-flex!important;align-items:center;gap:6px;height:24px;padding:0 6px 0 9px!important;border:1px solid var(--line2)!important;font-size:12px}
.chip svg{width:12px;height:12px}
.chip:hover{border-color:var(--mid)!important}
.sortb{color:var(--mid)} .sortb:hover{color:var(--ink)}
.scroll{flex:1;overflow:auto;padding:10px 28px 28px;min-height:0}
.grid{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);gap:30px 16px}
.tile{display:flex!important;flex-direction:column;gap:8px;min-width:0}
.tile .th{aspect-ratio:1;background:var(--tile)}
.tile .nm{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ty{margin-top:-6px;font-size:11.5px;color:var(--low)}
.tile .sz{display:none}
.tile .fav{position:absolute;top:6px;right:6px;opacity:0;color:var(--ink);z-index:1}
.tile:hover .fav{opacity:.85}
.tile .fav.on{opacity:1} .tile .fav.on svg{fill:currentColor}
.grid.list{grid-template-columns:1fr;gap:0}
.grid.list .tile{flex-direction:row;align-items:center;gap:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.grid.list .th{width:34px;flex:0 0 34px}
.grid.list .nm{flex:1}
.grid.list .ty{margin:0;width:110px}
.grid.list .sz{display:block;width:80px;text-align:right}
.grid.list .lidded::before{top:0;bottom:0;left:-12px;right:auto;width:3px;height:auto}
.grid.list .fav{display:none}
.empty{color:var(--mid);padding:40px 0;font-size:14px}
.details{border-left:1px solid var(--line);padding:22px 28px;display:flex;flex-direction:column;gap:16px;min-width:0;overflow:auto}
.details .pv{height:180px;background:var(--tile);flex:0 0 auto;cursor:zoom-in}
.nm-big{font-size:17px;font-weight:300;overflow-wrap:anywhere}
.nmrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.star{color:var(--mid)} .star.on{color:var(--ink)} .star.on svg{fill:currentColor}
.kv{display:grid;grid-template-columns:auto 1fr}
.kv span{padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--mid)}
.kv span:nth-child(even){font-family:var(--f-mono);font-size:11.5px;text-align:right;padding-left:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv span:nth-last-child(-n+2){border-bottom:0}
.kv .bad{color:var(--fault)!important}
.grpd{display:flex;flex-direction:column;gap:8px}
.dims{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line)}
.dims div{padding:8px 10px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line)}
.dims div:first-child{border-left:0}
.dims b{font-weight:400;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.vars{display:flex;gap:6px;flex-wrap:wrap}
.vars button{font-size:11.5px!important;padding:3px 8px!important;border:1px solid var(--line)!important;color:var(--mid)}
.vars button:hover{color:var(--ink)}
.vars button.on{border-color:var(--line2)!important;color:var(--ink)}
.maps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.maps div{display:flex;flex-direction:column;gap:4px;min-width:0}
.maps canvas{aspect-ratio:1;height:auto;background:var(--tile)}
.maps span{font-size:10.5px;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maps .miss canvas{outline:1px solid var(--fault);outline-offset:-1px;opacity:.25}
.maps .miss span{color:var(--fault)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11.5px;border:1px solid var(--line2);padding:2px 8px;color:var(--ink)}
button.tag.add{color:var(--low);border:1px dashed var(--line2)!important;padding:2px 8px!important}
button.tag.add:hover{color:var(--ink)}
.tagin{width:96px;height:23px;background:var(--ground);border:1px solid var(--mid);padding:0 6px;font-size:11.5px;outline:0}
.acts{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:0 0 auto}
.none{color:var(--low);margin:auto 0;text-align:center}

/* popovers: right-click menu, filter, sort */
.menu{position:absolute;z-index:20;min-width:236px;background:var(--surface);border:1px solid var(--line2);padding:5px 0;display:flex;flex-direction:column}
.menu button{display:flex!important;justify-content:space-between;align-items:center;gap:24px;height:28px;padding:0 12px!important;color:var(--ink)}
.menu button:hover,.menu button.hl{background:var(--tile)}
.menu button kbd{font-family:var(--f-mono);font-size:10.5px;color:var(--low)}
.menu button .ck{width:14px;color:var(--ink)}
.menu .lb{padding:6px 12px 4px;font-size:12px;color:var(--mid)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0;width:100%}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--ground);padding:8px 14px;font-size:12.5px;max-width:700px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:0;transition:opacity .15s}
.toast.on{opacity:1}

/* settings sheet */
.sheet{position:absolute;top:40px;right:0;bottom:0;width:380px;background:var(--surface);border-left:1px solid var(--line2);padding:20px 28px;display:flex;flex-direction:column;gap:22px;z-index:8;overflow:auto}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-right:-14px}
.sheet .hd b{font-weight:300;font-size:17px}
.sheet .root{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.sheet .root span:first-child{flex:1}
.lnk{display:inline-flex!important;align-items:center;gap:8px;color:var(--mid)}
.lnk:hover{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line2)}
.seg button{padding:3px 10px!important;color:var(--mid);font-size:12px}
.seg button.on{background:var(--tile);color:var(--ink)}
.srow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow span{color:var(--mid)}

/* Search */
.search{position:absolute;top:40px;left:0;right:0;bottom:0;display:flex;flex-direction:column;padding:0 96px;background:var(--ground);z-index:4}
.search .field{margin-top:64px;position:relative;padding-top:14px;flex:0 0 auto}
.search .field::before{content:"";position:absolute;left:0;top:0;width:100%;height:5px;background:var(--lid)}
.search .q{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line2);padding-bottom:14px}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-weight:300;font-size:40px;line-height:1.2;padding:0;caret-color:var(--lid);user-select:text}
.search input::placeholder{color:var(--low)}
.search .tchip{font-size:12px;border:1px solid var(--line2);padding:5px 9px;white-space:nowrap}
.search .meta{margin-top:12px}
.search .groups{margin-top:36px;display:flex;flex-direction:column;gap:32px;flex:1;overflow:auto;padding-bottom:32px;padding-top:8px}
.search .grp{display:grid;grid-template-columns:120px 1fr;gap:24px;align-items:start}
.search .row{display:flex;gap:16px;flex-wrap:wrap}
.search .res{width:156px;display:flex!important;flex-direction:column;gap:8px}
.search .res .th{width:156px;height:156px;background:var(--tile)}
.search .res .nm{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search .res mark{background:none;color:var(--lid)}

/* Inspector */
.insp{position:absolute;top:40px;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 340px;grid-template-rows:1fr 132px;background:var(--ground);z-index:3}
.insp .view{position:relative;min-width:0;min-height:0}
.insp .view canvas{position:absolute;inset:0}
.insp .view.turn{cursor:grab}
.insp .ov{position:absolute;left:28px;right:28px;bottom:20px;display:flex;justify-content:flex-end;align-items:center;gap:16px;white-space:nowrap}
.insp .ev{display:flex;align-items:center;gap:12px}
.insp .ev input{width:180px;accent-color:var(--lid)}
.insp .side{border-left:1px solid var(--line);padding:24px 28px;display:flex;flex-direction:column;gap:16px;grid-column:2;grid-row:1/3;min-width:0;overflow:auto}
.insp .side .nm-big{font-size:21px;line-height:1.2}
.insp .strip{grid-column:1;grid-row:2;border-top:1px solid var(--line);padding:26px 28px 0;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden}
.insp .strip button{width:80px;height:80px;flex:0 0 auto;background:var(--tile)}
.insp .strip button:not(.on) canvas{opacity:.55}
.insp .strip button:hover canvas{opacity:1}
.foot{max-width:1280px;width:100%;margin:0 auto;color:var(--low);font-size:12.5px}
.foot kbd{font-family:var(--f-mono);font-size:11px;color:var(--mid)}
</style>

<div class="top"><span><b>Capsa</b> · draft 1 · 11 Nov 2026</span><span>Example library. Nothing here reads your drives.</span></div>
<div class="stage" id="stage"><div class="win" id="win">
  <div class="tb">
    <div class="logo"><svg class="lock" viewBox="0 0 292 50" aria-label="Capsa" role="img"><use href="#lockup"/></svg></div>
    <div class="mid" id="tbMid"><button class="sbox" type="button" id="openSearch"><svg class="i"><use href="#i-search"/></svg><span>Search <span id="sCount"></span> assets</span><kbd>Ctrl K</kbd></button></div>
    <div class="crumb m" id="crumb" hidden></div>
    <div class="right">
      <span class="scan m" id="scan" hidden><span id="scanTxt"></span><i><b id="scanBar"></b></i></span>
      <span class="pos m" id="pos" hidden><button type="button" id="prevI" aria-label="Previous"><svg class="i"><use href="#i-left"/></svg></button><span id="posTxt"></span><button type="button" id="nextI" aria-label="Next"><svg class="i"><use href="#i-right"/></svg></button></span>
      <button class="ib" type="button" id="gear" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
      <div class="wc" aria-hidden="true"><span><svg class="i"><use href="#i-min"/></svg></span><span><svg class="i"><use href="#i-max"/></svg></span><span class="x"><svg class="i"><use href="#i-x"/></svg></span></div>
    </div>
  </div>

  <div class="cat" id="vCat">
    <nav id="nav"></nav>
    <main>
      <div class="head">
        <span class="t" id="title">All</span><span class="m dim" id="count"></span>
        <button class="fbtn" type="button" id="fBtn"><svg class="i"><use href="#i-filter"/></svg>Filter</button>
        <span id="chips" style="display:flex;gap:6px"></span>
        <div class="tools"><input id="sz" type="range" min="3" max="7" step="1" value="5" aria-label="Thumbnail size"><button class="ib" type="button" id="viewBtn" aria-label="Switch to list"><svg class="i"><use href="#i-list"/></svg></button><button class="sortb" type="button" id="sortBtn">Recent ▾</button></div>
      </div>
      <div class="scroll" id="scroll"><div class="grid" id="grid"></div></div>
    </main>
    <aside class="details" id="details"></aside>
  </div>

  <div class="search" id="vSearch" hidden>
    <div class="field">
      <label class="q"><input id="q" type="text" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search assets"><span class="tchip" id="tchip" hidden></span></label>
      <div class="meta m dim" id="qCount"></div>
    </div>
    <div class="groups" id="groups"></div>
  </div>

  <div class="insp" id="vInsp" hidden>
    <div class="view" id="view"><canvas id="viewC" aria-label="Preview"></canvas>
      <div class="ov"><span class="ev dim" id="ev" hidden>EV <input id="evIn" type="range" min="-3" max="3" step=".5" value="0" aria-label="Exposure"><span id="evOut" class="m" style="color:var(--ink);width:36px">+0.0</span></span></div>
    </div>
    <div class="side" id="iSide"></div>
    <div class="strip" id="strip"></div>
  </div>

  <div class="sheet" id="sheet" hidden></div>
  <div class="toast" id="toast"></div>
</div></div>
<div class="foot">Try: right-click a tile · double-click or <kbd>Space</kbd> to inspect · arrow keys · <kbd>Ctrl K</kbd> to search · <kbd>Esc</kbd> to go back · <kbd>F</kbd> favourite</div>

<symbol id="i-min" viewBox="0 0 16 16"><path d="M3.5 8h9"/></symbol>
<symbol id="i-max" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9"/></symbol>
<symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
<symbol id="i-grid" viewBox="0 0 16 16"><path d="M2.5 2.5h4.5v4.5H2.5zM9 2.5h4.5v4.5H9zM2.5 9h4.5v4.5H2.5zM9 9h4.5v4.5H9z"/></symbol>
<symbol id="i-list" viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></symbol>
<symbol id="i-filter" viewBox="0 0 16 16"><path d="M2 4h12M4.5 8h7M7 12h2"/></symbol>

  if(!hits.length){g.innerHTML='<p class="empty">Nothing matches.</p>';return;}
  ['texture','model','hdri','cache'].forEach(function(k){var hs=hits.filter(function(a){return a.k===k;});if(!hs.length)return;
    var gp=document.createElement('div');gp.className='grp';gp.innerHTML='<span class="cap" style="padding-top:2px">'+TYPE[k]+'s <span class="low">'+hs.length+'</span></span><div class="row"></div>';
    hs.forEach(function(a){var r=document.createElement('button');r.type='button';r.className='res';r.dataset.id=a.id;
      var nm=esc(a.n);if(q){var ix=a.n.toLowerCase().indexOf(q);if(ix>-1)nm=esc(a.n.slice(0,ix))+'<mark>'+esc(a.n.slice(ix,ix+q.length))+'</mark>'+esc(a.n.slice(ix+q.length));}
      r.innerHTML='<div class="th lidded'+(hitsFlat.length?'':' on')+'"></div><span class="nm">'+nm+'</span><span class="low" style="margin-top:-6px;font-size:11.5px">'+typeOf(a)+' · '+size(a.mb)+'</span>';
      gp.lastChild.appendChild(r);thumb(r.firstChild,a);hitsFlat.push(a);});
    g.appendChild(gp);});}
$('q').addEventListener('input',renderSearch);
$('q').addEventListener('keydown',function(e){if(e.key==='Enter'&&hitsFlat.length){openInsp(hitsFlat[0].id,hitsFlat);}});
$('groups').addEventListener('click',function(e){var r=e.target.closest('.res');if(r)openInsp(+r.dataset.id,hitsFlat);});
$('groups').addEventListener('contextmenu',function(e){var r=e.target.closest('.res');if(!r)return;e.preventDefault();$('groups').querySelectorAll('.th').forEach(function(t){t.classList.toggle('on',t.parentNode===r);});assetMenu(A[+r.dataset.id],e.clientX,e.clientY);});

/* Inspector */
var IL=[],II=0,rot=0,back='cat';
function openInsp(id,list){back=S.view==='search'?'search':'cat';IL=(list&&list.length?list:(VIS.length?VIS:A)).slice();II=Math.max(0,IL.indexOf(A[id]));if(IL.indexOf(A[id])<0){IL.unshift(A[id]);II=0;}
  S.sel=id;S.ev=0;$('evIn').value=0;$('evOut').textContent='+0.0';setView('insp');renderStrip();renderInsp();}
function cur(){return IL[II];}
function drawView(){var a=cur(),cv=$('viewC');drawCv(cv,a,{full:true,ev:S.ev,rot:rot});}
function renderInspSide(){var a=cur();$('iSide').innerHTML=infoHtml(a,true);fillMaps($('iSide'),a);}
function renderInsp(){var a=cur();S.sel=a.id;rot=0;
  $('crumb').innerHTML='<button type="button" id="crumbBack">'+(back==='search'?'Search':esc(libName(S.lib)))+'</button> / '+esc(a.path.split('/').slice(-2,-1)[0])+' / <b>'+esc(a.n)+'</b>';
  $('crumbBack').addEventListener('click',goBack);
  $('posTxt').textContent=(II+1)+' / '+IL.length;$('ev').hidden=a.k!=='hdri';
  $('view').classList.toggle('turn',a.k==='texture'&&a.set&&S.texView==='sphere');
  drawView();renderInspSide();
  $('strip').querySelectorAll('button').forEach(function(b,i){b.classList.toggle('on',i===II);b.firstChild.classList.toggle('on',i===II);if(i===II)b.scrollIntoView({block:'nearest',inline:'nearest'});});}
function renderStrip(){var s=$('strip');s.innerHTML='';IL.forEach(function(a,i){var b=document.createElement('button');b.type='button';b.setAttribute('aria-label',a.n);b.innerHTML='<div class="lidded" style="width:100%;height:100%"></div>';
  b.addEventListener('click',function(){II=i;renderInsp();});b.addEventListener('contextmenu',function(e){e.preventDefault();assetMenu(a,e.clientX,e.clientY);});s.appendChild(b);thumb(b.firstChild,a);});}
function step(d){if(!IL.length)return;II=(II+d+IL.length)%IL.length;renderInsp();}
$('prevI').addEventListener('click',function(){step(-1);});$('nextI').addEventListener('click',function(){step(1);});
$('evIn').addEventListener('input',function(){S.ev=+this.value;$('evOut').textContent=(S.ev>=0?'+':'')+S.ev.toFixed(1);drawView();});
(function(){var drag=null;$('view').addEventListener('pointerdown',function(e){if(!$('view').classList.contains('turn'))return;drag=[e.clientX,rot];this.setPointerCapture(e.pointerId);});
  $('view').addEventListener('pointermove',function(e){if(!drag)return;rot=drag[1]+(e.clientX-drag[0])*.01;drawView();});
  $('view').addEventListener('pointerup',function(){drag=null;});})();
function goBack(){setView(back==='search'?'search':'cat');}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',function(e){var k=e.key,typing=e.target.tagName==='INPUT'&&e.target.type==='text';
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='k'){e.preventDefault();setView('search');return;}
  if(k==='Escape'){if(document.querySelector('.menu')){closeMenus();return;}if(!$('sheet').hidden){setSheet(false);return;}if(S.view==='insp'){goBack();return;}if(S.view==='search'){setView('cat');return;}}
  if(typing)return;
  var a=S.view==='insp'?cur():A[S.sel];
  if(S.view==='insp'){if(k==='ArrowRight'){step(1);e.preventDefault();}else if(k==='ArrowLeft'){step(-1);e.preventDefault();}}
  else if(S.view==='cat'&&VIS.length){var i=VIS.indexOf(A[S.sel]),c=S.list?1:S.cols,n=-1;
    if(k==='ArrowRight'&&!S.list)n=i+1;else if(k==='ArrowLeft'&&!S.list)n=i-1;else if(k==='ArrowDown')n=i+c;else if(k==='ArrowUp')n=i-c;
    if(n>-1||k.indexOf('Arrow')===0){e.preventDefault();if(n>=0&&n<VIS.length)select(VIS[n].id,true);}
    if(k===' '||k==='Enter'){e.preventDefault();openInsp(S.sel);}}
  if(!a||S.view==='search')return;
  if(k==='f'||k==='F')toggleFav(a);
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='c'){e.preventDefault();copyPath(a);}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='e'){e.preventDefault();explorer(a);}
  else if(k==='t'||k==='T'){var b=document.querySelector((S.view==='insp'?'#iSide':'#details')+' [data-act="tag"]');if(b){e.preventDefault();editTag(b,a);}}});

/* ---------- fit the window ---------- */
function fit(){var st=$('stage'),w=st.clientWidth,avail=Math.max(300,window.innerHeight-110),sc=Math.min(1,w/1280,avail/800);
  st.style.height=(800*sc)+'px';st.style.width=(1280*sc)+'px';win.style.transform='scale('+sc+')';closeMenus();}
window.addEventListener('resize',function(){$('stage').style.width='';fit();});
fit();renderAll(false);
})();
</script>
