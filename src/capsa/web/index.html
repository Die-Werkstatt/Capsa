<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capsa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="drag pywebview-drag-region"></div>
  <svg class="lockup" viewBox="0 0 292 50" role="img" aria-label="Capsa">
    <g fill="none" stroke="#EDEDED" stroke-width="10" stroke-linejoin="miter" stroke-linecap="butt">
      <rect x="0" y="0" width="50" height="10" fill="#4F8CFF" stroke="none"/><path d="M5 16V45H22M28 45H45V16"/>
      <g transform="translate(68 0)"><path d="M40 5H5V45H40"/>
        <g transform="translate(46 0)"><rect x="0" y="0" width="40" height="10" fill="#4F8CFF" stroke="none"/><path d="M5 16V50M35 16V50M5 27H35"/></g>
        <g transform="translate(92 0)"><path d="M5 50V5H35V27H5"/></g>
        <g transform="translate(138 0)"><path d="M40 5H5V27H35V45H0"/></g>
        <g transform="translate(184 0)"><rect x="0" y="0" width="40" height="10" fill="#4F8CFF" stroke="none"/><path d="M5 16V50M35 16V50M5 27H35"/></g>
      </g>
    </g>
  </svg>
  <label class="search">
    <svg class="icon" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
    <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
    <kbd>Ctrl K</kbd>
  </label>
  <div class="controls">
    <button id="settings" class="settings" type="button" aria-label="Settings"><svg class="icon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><circle cx="8" cy="8" r="4.7"/><path d="M8 1v2.3M8 12.7V15M1 8h2.3M12.7 8H15M3 3l1.7 1.7M11.3 11.3L13 13M3 13l1.7-1.7M11.3 4.7L13 3"/></svg></button>
    <button id="minimize" type="button" aria-label="Minimise"><svg class="icon" viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg></button>
    <button id="maximize" type="button" aria-label="Maximise"><svg class="icon" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9"/></svg></button>
    <button id="close" class="close" type="button" aria-label="Close"><svg class="icon" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <div id="progress" class="progress"></div>
</header>
<div class="catalogue">
  <nav id="nav"></nav>
  <main>
    <div class="head">
      <h1 id="title">All</h1><span id="count" class="count"></span>
      <div class="tools">
        <input id="tile-size" type="range" min="100" max="260" step="20" value="160" aria-label="Thumbnail size">
        <button id="layout" class="tool" type="button" aria-label="Switch to list"></button>
        <select id="sort" aria-label="Sort">
          <option value="recent">Recent</option>
          <option value="name">Name</option>
          <option value="size">Size</option>
        </select>
      </div>
    </div>
    <div id="grid" class="grid"></div>
  </main>
  <aside id="details" class="details"></aside>
</div>
<aside id="sheet" class="sheet" hidden>
  <div class="sheet-head"><h2>Settings</h2><button id="sheet-close" type="button" aria-label="Close settings"><svg class="icon" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
  <section>
    <h3>Library folders</h3>
    <div id="folders"></div>
    <button id="add-folder" class="link" type="button"><svg class="icon" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>Add folder</button>
  </section>
  <section>
    <h3>Index</h3>
    <div class="rows"><span>Assets</span><span id="asset-count"></span></div>
    <button id="rescan" class="link" type="button">Rescan all</button>
  </section>
</aside>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
