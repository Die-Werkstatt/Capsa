[project]
name = "capsa"
version = "0.1.0"
description = "Asset library for VFX/3D"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2",
    # aislop 0.16.0 runs this exact ruff and skips its Python checks on any other.
    "ruff==0.16.7",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
